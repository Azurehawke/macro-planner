services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-macro_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-macro_planner}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-macro_planner}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-macro_planner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-macro_planner}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORT: 3000
      NODE_ENV: production
      # Only set COOKIE_SECURE=false in .env while testing over plain http://;
      # switch it back to true (or unset it) once accessed via HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Free key from https://fdc.nal.usda.gov/api-key-signup.html - leave unset
      # to skip USDA results (Open Food Facts search still works without it).
      USDA_FDC_API_KEY: ${USDA_FDC_API_KEY:-}
      OFF_USER_AGENT: ${OFF_USER_AGENT:-}
    ports:
      - '${APP_PORT:-9125}:3000'

volumes:
  db_data:
